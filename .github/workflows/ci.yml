# Trimmed from the unbranded repo's own workflow: dropped its OS/Node matrix and
# the create-unbranded smoke step, which are CLI-internal. This runs the three
# scripts opt-ci-github's units provide (lint, typecheck, test) on a single leg,
# which is enough signal for a scaffold and cheap to run.
#
# The template ships pnpm steps by default. This repo is on npm, so the install
# steps below diverge from the scaffold on purpose; `unbranded diff` will report
# the drift and `unbranded update` will treat it as a local edit to merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node-version-file reads .nvmrc, so the runtime under test can't drift
      # from the one developers get locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
