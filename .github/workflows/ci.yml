# Trimmed from the unbranded repo's own workflow: dropped its OS/Node matrix and
# the create-unbranded smoke step, which are CLI-internal. This runs the three
# scripts opt-ci-github's units provide (lint, typecheck, test) on a single leg,
# which is enough signal for a scaffold and cheap to run.
#
# This workflow departs from the scaffold in one place. It reads the Node version
# from .nvmrc instead of a pin, so `unbranded diff` reports drift here and
# `unbranded update` merges the difference as a local edit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup needs no version pin, because it reads the version from
      # package.json's packageManager field. Keep this step ahead of setup-node,
      # which cannot enable `cache: pnpm` until a pnpm binary exists on the runner.
      - uses: pnpm/action-setup@v4

      # node-version-file reads .nvmrc, so the runtime under test can't drift
      # from the one developers get locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
