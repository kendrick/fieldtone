# Trimmed from the unbranded repo's own workflow: dropped its OS/Node matrix and
# the create-unbranded smoke step, which are CLI-internal. Everything runs on a
# single leg; a matrix buys little for an app whose only runtime pin is .nvmrc.
#
# This workflow departs from the scaffold in two places. It reads the Node version
# from .nvmrc instead of a pin, so `unbranded diff` reports drift here and
# `unbranded update` merges the difference as a local edit. It also builds the
# static export and drives Playwright against it, because a green unit suite says
# nothing about whether the artifact that actually ships renders.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup needs no version pin, because it reads the version from
      # package.json's packageManager field. Keep this step ahead of setup-node,
      # which cannot enable `cache: pnpm` until a pnpm binary exists on the runner.
      - uses: pnpm/action-setup@v4

      # node-version-file reads .nvmrc, so the runtime under test can't drift
      # from the one developers get locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint CSS
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build static export
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Chromium alone. WebKit and Firefox stay a local check: three engines here
      # would triple the browser download for a shell that renders one heading.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e --project=mobile-chrome --project=desktop-chrome

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
