# Publishes the static export to GitHub Pages. Pages must be configured with
# "GitHub Actions" as its source in repo settings; this workflow cannot enable it.
#
# Deploys on push to main without re-running the suite. Main only moves through
# pull requests, and ci.yml has already run against the merge result, so gating
# this on a second full run would double the wait to publish a commit that is
# already green.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them. A cancelled deploy leaves Pages on
# whatever shipped last, which is worse than waiting for the one in front.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No base path to pass: next.config.ts sets it, so this build is the same
      # one the e2e suite already exercised on the pull request.
      - name: Build static export
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
